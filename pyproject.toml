[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lacre"
version = "0.2.0"
description = "Libro de evidencia a prueba de manipulación: cadena de hashes, Merkle y afirmaciones que caducan. Cero dependencias."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Esraderey" }]
keywords = ["merkle", "provenance", "evidence", "reproducibility", "audit-log"]
dependencies = []

[project.scripts]
lacre = "lacre.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lacre"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
